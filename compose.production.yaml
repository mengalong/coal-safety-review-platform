name: coal-safety-review-production

x-api-environment: &api-environment
  COAL_ENVIRONMENT: production
  COAL_STORE_BACKEND: database
  COAL_SEED_DEMO_DATA: "false"
  COAL_DATABASE_URL: postgresql+psycopg://coal:${COAL_POSTGRES_PASSWORD:?required}@postgres:5432/coal
  COAL_REDIS_URL: redis://:${COAL_REDIS_PASSWORD:?required}@redis:6379/0
  COAL_DISPATCH_JOBS: "true"
  COAL_STORAGE_BACKEND: minio
  COAL_MINIO_ENDPOINT: minio:9000
  COAL_MINIO_ACCESS_KEY: ${COAL_MINIO_ACCESS_KEY:?required}
  COAL_MINIO_SECRET_KEY: ${COAL_MINIO_SECRET_KEY:?required}
  COAL_MINIO_BUCKET: coal-review
  COAL_OCR_BACKEND: tesseract
  COAL_OCR_LANGUAGES: chi_sim+eng
  COAL_SECRET_KEY: ${COAL_SECRET_KEY:?required}
  COAL_MODEL_SECRET_KEY: ${COAL_MODEL_SECRET_KEY:?required}
  COAL_QIANFAN_API_KEY: ${COAL_QIANFAN_API_KEY:?required}
  COAL_CORS_ORIGINS: '["${COAL_PUBLIC_ORIGIN:?required}"]'

services:
  web:
    build:
      context: ./frontend
    ports:
      - "${COAL_PUBLIC_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./frontend/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${COAL_TLS_CERT_FILE:?required}:/etc/nginx/tls/tls.crt:ro
      - ${COAL_TLS_KEY_FILE:?required}:/etc/nginx/tls/tls.key:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, application]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment: *api-environment
    expose: ["8000"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [application, data]

  worker:
    build:
      context: .
    command: celery -A coal_platform.worker:celery_app worker --loglevel=INFO --queues=coal --concurrency=2
    environment: *api-environment
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    networks: [application, data]

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: coal
      POSTGRES_USER: coal
      POSTGRES_PASSWORD: ${COAL_POSTGRES_PASSWORD:?required}
    volumes:
      - coal_postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coal -d coal"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${COAL_REDIS_PASSWORD:?required}"]
    volumes:
      - coal_redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${COAL_REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      COAL_REDIS_PASSWORD: ${COAL_REDIS_PASSWORD:?required}
    security_opt: ["no-new-privileges:true"]

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${COAL_MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${COAL_MINIO_SECRET_KEY:?required}
    volumes:
      - coal_minio_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  minio-client:
    image: minio/mc:latest
    profiles: ["maintenance"]
    entrypoint: /bin/sh
    environment:
      MINIO_ROOT_USER: ${COAL_MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${COAL_MINIO_SECRET_KEY:?required}
    volumes:
      - ${COAL_BACKUP_PATH:-./backups}:/backups
    networks: [data]
    depends_on:
      minio:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  application:
    internal: true
  data:
    internal: true

volumes:
  coal_postgres_data:
  coal_redis_data:
  coal_minio_data:
