name: coal-safety-review-production

x-api-environment: &api-environment
  COAL_ENVIRONMENT: production
  COAL_STORE_BACKEND: database
  COAL_SEED_DEMO_DATA: "false"
  COAL_DATABASE_URL: postgresql+psycopg://coal:${COAL_POSTGRES_PASSWORD:?required}@postgres:5432/coal
  COAL_REDIS_URL: redis://:${COAL_REDIS_PASSWORD:?required}@redis:6379/0
  COAL_DISPATCH_JOBS: "true"
  COAL_STORAGE_BACKEND: minio
  COAL_MINIO_ENDPOINT: minio:9000
  COAL_MINIO_ACCESS_KEY: ${COAL_MINIO_ACCESS_KEY:?required}
  COAL_MINIO_SECRET_KEY: ${COAL_MINIO_SECRET_KEY:?required}
  COAL_MINIO_BUCKET: coal-review
  COAL_OCR_BACKEND: tesseract
  COAL_OCR_LANGUAGES: chi_sim+eng
  COAL_SECRET_KEY: ${COAL_SECRET_KEY:?required}
  COAL_METRICS_TOKEN: ${COAL_METRICS_TOKEN:?required}
  COAL_MODEL_SECRET_KEY: ${COAL_MODEL_SECRET_KEY:?required}
  COAL_QIANFAN_API_KEY: ${COAL_QIANFAN_API_KEY:?required}
  COAL_CORS_ORIGINS: '["${COAL_PUBLIC_ORIGIN:?required}"]'

services:
  web:
    image: ${COAL_WEB_IMAGE:-coal-safety-review-web:local}
    build:
      context: ./frontend
      args:
        NODE_BASE_IMAGE: ${COAL_NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine}
        NGINX_BASE_IMAGE: ${COAL_NGINX_BASE_IMAGE:-public.ecr.aws/nginx/nginx-unprivileged:1.27-alpine}
    ports:
      - "${COAL_PUBLIC_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./frontend/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${COAL_TLS_CERT_FILE:?required}:/etc/nginx/tls/tls.crt:ro
      - ${COAL_TLS_KEY_FILE:?required}:/etc/nginx/tls/tls.key:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, application]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    image: ${COAL_API_IMAGE:-coal-safety-review-api:local}
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${COAL_PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    environment: *api-environment
    expose: ["8000"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [application, data]

  worker:
    image: ${COAL_API_IMAGE:-coal-safety-review-api:local}
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${COAL_PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    command: celery -A coal_platform.worker:celery_app worker --loglevel=INFO --queues=coal --concurrency=2
    environment: *api-environment
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    networks: [application, data]
    healthcheck:
      test: ["CMD-SHELL", "celery -A coal_platform.worker:celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: ${COAL_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: coal
      POSTGRES_USER: coal
      POSTGRES_PASSWORD: ${COAL_POSTGRES_PASSWORD:?required}
    volumes:
      - coal_postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coal -d coal"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  redis:
    image: ${COAL_REDIS_IMAGE:-public.ecr.aws/docker/library/redis:7.4-alpine}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${COAL_REDIS_PASSWORD}\""]
    volumes:
      - coal_redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${COAL_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      COAL_REDIS_PASSWORD: ${COAL_REDIS_PASSWORD:?required}
    security_opt: ["no-new-privileges:true"]

  minio:
    image: ${COAL_MINIO_IMAGE:-minio/minio:RELEASE.2025-06-13T11-33-47Z-cpuv1}
    command: server /data
    environment:
      MINIO_ROOT_USER: ${COAL_MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${COAL_MINIO_SECRET_KEY:?required}
    volumes:
      - coal_minio_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  minio-client:
    image: ${COAL_MINIO_CLIENT_IMAGE:-minio/mc:RELEASE.2025-05-21T01-59-54Z-cpuv1}
    profiles: ["maintenance"]
    entrypoint: /bin/sh
    environment:
      MINIO_ROOT_USER: ${COAL_MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${COAL_MINIO_SECRET_KEY:?required}
    volumes:
      - ${COAL_BACKUP_PATH:-./backups}:/backups
    networks: [data]
    depends_on:
      minio:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules.yml:/etc/prometheus/rules.yml:ro
      - coal_prometheus_data:/prometheus
    secrets: [metrics_token]
    networks: [application]
    depends_on:
      api:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - coal_alertmanager_data:/alertmanager
    networks: [application]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  alert-notifier:
    image: ${COAL_API_IMAGE:-coal-safety-review-api:local}
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${COAL_PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    profiles: ["observability"]
    command: uvicorn coal_platform.alert_notifier:app --host 0.0.0.0 --port 8080
    environment:
      COAL_ALERT_WEBHOOK_URL: ${COAL_ALERT_WEBHOOK_URL:?required}
      COAL_ALERT_WEBHOOK_TOKEN: ${COAL_ALERT_WEBHOOK_TOKEN:-}
    read_only: true
    tmpfs: [/tmp]
    networks: [application, edge]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  loki:
    image: grafana/loki:3.5.3
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - coal_loki_data:/loki
    networks: [application]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  promtail:
    image: grafana/promtail:3.5.3
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./deploy/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - coal_promtail_positions:/tmp
    networks: [application]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${COAL_GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${COAL_GRAFANA_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/coal.yml:ro
      - coal_grafana_data:/var/lib/grafana
    networks: [application]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
  application:
    internal: true
  data:
    internal: true

volumes:
  coal_postgres_data:
  coal_redis_data:
  coal_minio_data:
  coal_prometheus_data:
  coal_alertmanager_data:
  coal_loki_data:
  coal_promtail_positions:
  coal_grafana_data:

secrets:
  metrics_token:
    file: ${COAL_METRICS_TOKEN_FILE:?required}
