[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coal-safety-review-platform"
version = "0.1.0"
description = "Coal mine safety technical document review platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "jsonschema>=4.23",
  "python-multipart>=0.0.9",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.3",
  "celery>=5.4",
  "redis>=5.0",
  "minio>=7.2",
  "openpyxl>=3.1",
  "pillow>=11.0",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.13",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx2>=0.28",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.setuptools.packages.find]
include = ["coal_platform*"]
